<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8eef0">
<title>Calm Fidget – stress relief toys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eef0;--ink:#26354d;--soft:#5d6e86;--card:#f7fafa;--sage:#8fc1a9;--lilac:#b7a8e8;--sun:#f4d58d;--sky:#9cc7e6;--shadow:#c5d1d6}
:root[data-theme=dark]{--bg:#1d2638;--ink:#e6edf7;--soft:#9fb0c8;--card:#27324a;--sage:#6fae94;--lilac:#8d7fd1;--sun:#d9b868;--sky:#6fa6cc;--shadow:#151c2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);user-select:none;-webkit-user-select:none}
.app{max-width:560px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:16px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:1.5rem;margin:0;font-weight:800}
.tools{display:flex;gap:8px}
.icon{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:1.1rem;box-shadow:0 3px 0 var(--shadow);cursor:pointer}
.icon:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
nav button{font:inherit;font-weight:700;font-size:.85rem;padding:10px 4px;border:0;border-radius:16px;background:var(--card);color:var(--soft);cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
nav button[aria-selected=true]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
main{flex:1;background:var(--card);border-radius:28px;padding:18px;box-shadow:0 6px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;gap:14px}
.panel{display:none;width:100%;flex-direction:column;align-items:center;gap:14px;flex:1}
.panel.on{display:flex}
.hint{margin:0;color:var(--soft);font-weight:700;text-align:center}
.pill{font:inherit;font-weight:800;border:0;border-radius:999px;padding:10px 22px;background:var(--sage);color:#17301f;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.pill:active{transform:translateY(2px)}
/* bubbles */
.bubbles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%}
.b{aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 32% 28%,#fff9,transparent 38%),var(--c);box-shadow:inset -5px -7px 10px #0002,0 4px 0 var(--shadow);transition:transform .08s}
.b:active{transform:scale(.92)}
.b.p{background:var(--shadow);box-shadow:inset 3px 4px 8px #0003;transform:scale(.8);opacity:.7}
/* spinner */
.stage{position:relative;width:min(78vw,300px);aspect-ratio:1;touch-action:none;cursor:grab}
#spin{width:100%;height:100%}
/* breathe */
.orb{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,transparent 45%),var(--sky);transition:transform 4s ease-in-out;box-shadow:0 0 0 14px #9cc7e633,0 0 0 34px #9cc7e61f}
.orb.in{transform:scale(1.5)}
.orb.out{transition-duration:6s;transform:scale(.8)}
.big{font-size:1.6rem;font-weight:800;margin:0}
/* switches */
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%}
.s{height:76px;border-radius:18px;border:0;background:var(--shadow);position:relative;cursor:pointer;box-shadow:inset 0 3px 6px #0003}
.s::after{content:"";position:absolute;left:8px;right:8px;top:8px;height:28px;border-radius:12px;background:var(--lilac);box-shadow:0 4px 0 #0003;transition:transform .09s}
.s[aria-pressed=true]::after{transform:translateY(28px);background:var(--sun);box-shadow:0 1px 0 #0003}
footer{text-align:center;color:var(--soft);font-size:.85rem;font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Calm Fidget</h1>
    <div class="tools">
      <button class="icon" id="snd" aria-label="Sound on" title="Sound">🔊</button>
      <button class="icon" id="thm" aria-label="Switch theme" title="Theme">🌙</button>
    </div>
  </header>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-t="bub">Pop</button>
    <button role="tab" aria-selected="false" data-t="spn">Spin</button>
    <button role="tab" aria-selected="false" data-t="brt">Breathe</button>
    <button role="tab" aria-selected="false" data-t="swt">Click</button>
  </nav>
  <main>
    <section class="panel on" id="bub">
      <p class="hint">Pop every bubble. <span id="cnt">0</span> popped so far</p>
      <div class="bubbles" id="grid"></div>
      <button class="pill" id="re">Refill bubbles</button>
    </section>
    <section class="panel" id="spn">
      <p class="hint">Flick the spinner and watch it slow down.</p>
      <div class="stage" id="stage"><svg id="spin" viewBox="-100 -100 200 200"></svg></div>
      <p class="hint" id="rpm">Still</p>
    </section>
    <section class="panel" id="brt">
      <p class="hint">Follow the circle. Breathe in as it grows, out as it shrinks.</p>
      <div style="flex:1;display:grid;place-items:center;padding:40px 0"><div class="orb" id="orb"></div></div>
      <p class="big" id="bl">Ready?</p>
      <button class="pill" id="bgo">Start</button>
    </section>
    <section class="panel" id="swt">
      <p class="hint">Flip the switches. Any order, no goal.</p>
      <div class="sw" id="sws"></div>
      <button class="pill" id="swr">Reset all</button>
    </section>
  </main>
  <footer>Take your time. Nothing here counts as winning.</footer>
</div>
<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let soundOn=store.get('sound',true),ctx;
function tone(f,d=.08,type='sine',vol=.15){
  if(!soundOn)return;
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(f/2,ctx.currentTime+d);
    g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);
    o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d);}catch(e){}
}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
/* settings */
function applySound(){$('#snd').textContent=soundOn?'🔊':'🔇';$('#snd').setAttribute('aria-label',soundOn?'Sound on':'Sound off')}
$('#snd').onclick=()=>{soundOn=!soundOn;store.set('sound',soundOn);applySound();tone(600)};
function applyTheme(t){document.documentElement.dataset.theme=t;$('#thm').textContent=t==='dark'?'☀️':'🌙';document.querySelector('meta[name=theme-color]').content=t==='dark'?'#1d2638':'#e8eef0'}
let theme=store.get('theme',matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
$('#thm').onclick=()=>{theme=theme==='dark'?'light':'dark';store.set('theme',theme);applyTheme(theme)};
applySound();applyTheme(theme);
/* tabs */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id===b.dataset.t));
  if(b.dataset.t!=='brt')stopBreath();
  tone(440,.05);
});
/* bubbles */
let total=store.get('popped',0);$('#cnt').textContent=total;
const cols=['var(--sage)','var(--lilac)','var(--sun)','var(--sky)'];
function fill(){const g=$('#grid');g.innerHTML='';
  for(let i=0;i<35;i++){const b=document.createElement('button');b.className='b';b.style.setProperty('--c',cols[(i+Math.floor(i/5))%4]);b.setAttribute('aria-label','Bubble');
    b.onpointerdown=()=>{if(b.classList.contains('p'))return;b.classList.add('p');tone(500+Math.random()*500,.07,'triangle',.2);buzz(12);total++;store.set('popped',total);$('#cnt').textContent=total};
    b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.onpointerdown()}};
    g.appendChild(b)}}
$('#re').onclick=()=>{fill();tone(350,.1)};fill();
/* spinner */
(function(){
  const svg=$('#spin'),cs=['var(--sage)','var(--lilac)','var(--sun)'];
  let h='<g id="rot">';
  for(let i=0;i<3;i++){const a=i*120;h+=`<g transform="rotate(${a})"><circle cx="0" cy="-58" r="34" fill="${cs[i]}"/><circle cx="0" cy="-58" r="14" fill="var(--card)"/><circle cx="0" cy="-58" r="9" fill="${cs[i]}" opacity=".5"/></g>`}
  h+='<circle r="30" fill="var(--ink)"/><circle r="14" fill="var(--card)"/></g>';
  svg.innerHTML=h;
  const rot=$('#rot');let ang=0,vel=0,drag=false,last=0,lastTick=0;
  const pt=e=>{const r=$('#stage').getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI};
  const st=$('#stage');
  st.onpointerdown=e=>{drag=true;last=pt(e);st.setPointerCapture(e.pointerId);vel=0};
  st.onpointermove=e=>{if(!drag)return;const p=pt(e);let d=p-last;if(d>180)d-=360;if(d<-180)d+=360;ang+=d;vel=d;last=p};
  st.onpointerup=st.onpointercancel=()=>drag=false;
  function loop(){
    if(!drag){ang+=vel;vel*=.985;if(Math.abs(vel)<.05)vel=0}
    rot.setAttribute('transform','rotate('+ang+')');
    if(Math.abs(ang-lastTick)>40){lastTick=ang;if(Math.abs(vel)>1)tone(180+Math.min(Math.abs(vel)*8,400),.03,'square',.05)}
    const r=Math.abs(vel)*60/360*60;$('#rpm').textContent=r<1?'Still':Math.round(r)+' rpm';
    requestAnimationFrame(loop)}
  loop();
})();
/* breathing */
let bt=[],running=false;
function stopBreath(){bt.forEach(clearTimeout);bt=[];running=false;$('#orb').className='orb';$('#bl').textContent='Ready?';$('#bgo').textContent='Start'}
function cycle(){if(!running)return;const o=$('#orb'),l=$('#bl');
  l.textContent='Breathe in…';o.className='orb in';tone(330,.4,'sine',.08);
  bt.push(setTimeout(()=>{l.textContent='Hold'},4000));
  bt.push(setTimeout(()=>{l.textContent='Breathe out…';o.className='orb out';tone(260,.5,'sine',.08)},5500));
  bt.push(setTimeout(cycle,11500))}
$('#bgo').onclick=()=>{if(running){stopBreath();return}running=true;$('#bgo').textContent='Stop';cycle()};
/* switches */
(function(){const w=$('#sws');
  for(let i=0;i<16;i++){const s=document.createElement('button');s.className='s';s.setAttribute('aria-pressed','false');s.setAttribute('aria-label','Switch '+(i+1));
    s.onclick=()=>{const on=s.getAttribute('aria-pressed')!=='true';s.setAttribute('aria-pressed',on);tone(on?700:450,.05,'square',.08);buzz(8)};w.appendChild(s)}
  $('#swr').onclick=()=>{w.querySelectorAll('.s').forEach(s=>s.setAttribute('aria-pressed','false'));tone(300,.1)}})();
</script>
</body>
</html>
